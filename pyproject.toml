[project]
name = "kubernetes-rag-pipeline"
version = "0.1.0"
description = "Kubernetes RAG pipeline"
readme = "README.md"
authors = [
    { name = "sthits123", email = "c7382087@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "boto3>=1.43.104",
    "fastapi>=0.141.1",
    "flashrank>=0.2.10",
    "langchain>=1.4.2",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.6.6",
    "langgraph>=1.2.12",
    "logfire[fastapi,requests]>=5.1.1",
    "loguru>=0.7.3",
    "nemoguardrails>=0.24.1",
    "nest-asyncio>=1.6.0",
    "numpy>=2.5.3",
    "ollama>=0.6.3",
    "pg8000>=1.31.5",
    "portkey-ai>=2.3.4",
    "pydantic>=2.0.0",
    "pymupdf>=1.28.2",
    "pypdf>=6.19.0",
    "pytesseract>=0.3.13",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
    "python-pptx>=1.0.2",
    "pytz>=2026.4",
    "qdrant-client>=1.19.1",
    "ragas>=0.4.3",
    "redis>=8.1.0",
    "requests>=2.34.2",
    "sqlalchemy>=2.1.1",
    "streamlit>=1.64.0",
    "unstructured>=0.27.10",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
kubernetes-rag-pipeline = "app.main:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = "."
